name: build

on:
  push:
    branches:
      - ros2
  pull_request:
    branches:
      - ros2
  schedule:
    - cron: '0 8 * * *'

jobs:
  install-and-run:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y git libboost-all-dev libeigen3-dev libyaml-cpp-dev libpoco-dev libgtest-dev python3-vcstool python3-colcon-common-extensions python3-rosdep

      - name: Setup workspace
        shell: bash
        run: |
          WORKSPACE_DIR=$(pwd)/openmore_ws
          echo "WORKSPACE_DIR=$(pwd)/openmore_ws" >> "$GITHUB_ENV"
          mkdir -p $WORKSPACE_DIR/src

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: "${{env.WORKSPACE_DIR }}/src/replanners_managers_lib"

      - name: Download deps with vcstool
        shell: bash
        run: |
          cd ${{env.WORKSPACE_DIR }}/src
          vcs import < replanners_managers_lib/deps.repos
          cd ${{env.WORKSPACE_DIR }}
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build & Install replanners_managers_lib with colcon
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ${{env.WORKSPACE_DIR }}
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
          source install/setup.bash
